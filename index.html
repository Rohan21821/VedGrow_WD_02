<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Unit Converter</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon"
href="https://cdn-icons-png.flaticon.com/512/32/32339.png">

</head>

<body>
    <div class="bg-icons">

<i class="fas fa-temperature-high icon i1"></i>
<i class="fas fa-ruler-combined icon i2"></i>
<i class="fas fa-weight-hanging icon i3"></i>
<i class="fas fa-clock icon i4"></i>
<i class="fas fa-calculator icon i5"></i>
<i class="fas fa-drafting-compass icon i6"></i>

</div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">

<header>

<h1>
<i class="fas fa-exchange-alt"></i>
Smart Unit Converter
</h1>

<p>
Convert Temperature, Length, Weight,
Area and Time instantly
</p>

</header>

<div class="stats">

<div>
<h3>5+</h3>
<p>Categories</p>
</div>

<div>
<h3>20+</h3>
<p>Units</p>
</div>

<div>
<h3>Real Time</h3>
<p>Conversion</p>
</div>

</div>

<div class="converter-box">

<select id="category">

<option value="temperature">🌡 Temperature</option>
<option value="length">📏 Length</option>
<option value="weight">⚖ Weight</option>
<option value="area">⬜ Area</option>
<option value="time">⏱ Time</option>
<option value="speed">🚗 Speed</option>

</select>

<input
type="number"
id="inputValue"
placeholder="Enter value to convert...">

<select id="fromUnit"></select>

<button id="swapBtn">
⇄ Swap Units
</button>

<select id="toUnit"></select>

<div class="result-box">
    <div class="conversion-type">
Current Category:
<span id="currentCategory">
Temperature
</span>
</div>
    <button id="copyBtn">
📋 Copy Result
</button>

<span>Converted Value</span>

<h2 id="result">
0
</h2>

</div>

</div>

<div class="history-box">

<h2>
<i class="fas fa-history"></i>
Recent Conversions
</h2>

<ul id="historyList"></ul>

<button id="clearHistory">
Clear History
</button>

</div>

<footer>

<p>
Developed by Rohan Bhapkar © 2026
</p>

</footer>

</div>

<script src="script.js"></script>

</body>
</html>
